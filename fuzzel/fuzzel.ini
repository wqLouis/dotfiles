# ─── Fuzzel Launcher (Catppuccin Mocha) ──────────────────────────────
# Docs: man fuzzel · man fuzzel.ini

[main]
# Font
font=JetBrainsMono Nerd Font:size=13

# Prompt
prompt=Run:
placeholder=Type to search…

# Match behavior
fields=name,generic,comment,keywords,filename,categories
match-mode=fuzzy
list-executables-in-path=no

# Main window
width=42
lines=12
anchor=center
y-margin=80
horizontal-pad=18
vertical-pad=12
inner-pad=10

# Icons — theme is read from ~/.local/share/icons/ (XDG_DATA_HOME/icons)
icon-theme=WhiteSur-dark


# ─── Catppuccin Mocha palette ────────────────────────────────────────
# Base #1e1e2e · Surface0 #313244 · Text #cdd6f4 · Subtext0 #a6adc8
# Overlay0 #6c7086 · Blue #89b4fa · Mauve #cba6f7 · Peach #fab387

[colors]
# Background layers
background=1e1e2eff
text=cdd6f4ff
selection=313244ff
selection-text=cdd6f4ff

# Highlights
match=cba6f7ff
selection-match=89b4faff
prompt=cdd6f4ff
input=cdd6f4ff
placeholder=6c7086cc
message=a6adc8ff
counter=cdd6f4aa

# Border color
border=89b4faff


[border]
width=2
radius=0
selection-radius=0
