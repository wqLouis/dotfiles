#######################################################################
#                       i3status-rust config                          #
#  https://docs.rs/i3status-rs/latest/i3status_rs/blocks/             #
#######################################################################

# ─── Bundled Catppuccin Mocha theme ──────────────────────────────────
[theme]
theme = "ctp-mocha"

[icons]
icons = "material-nf"

# ─── Custom: current desktop name ────────────────────────────────────
[[block]]
block = "custom"
command = "echo ${XDG_CURRENT_DESKTOP:-sway} | tr '[:lower:]' '[:upper:]'"
interval = 600
format = "{ $icon|} $text.pango-str() "

# ─── Focused window title ────────────────────────────────────────────
# The `|` fallback is required: `title` is only registered as a placeholder
# when the focused window has a non-empty title (see src/blocks/focused_window.rs).
# Without the fallback, an empty title emits "Placeholder 'title' not found".
# Conditional groups `{ ... }` do NOT suppress this error.
[[block]]
block = "focused_window"
driver = "auto"
format = " $title.str(max_w:60) |"

# ─── CPU ─────────────────────────────────────────────────────────────
# "CPU" text label disambiguates from the memory block.
[[block]]
block = "cpu"
interval = 5
info_cpu = 30
warning_cpu = 70
critical_cpu = 90
format = " CPU $icon $utilization "

# ─── Memory ──────────────────────────────────────────────────────────
[[block]]
block = "memory"
interval = 5
format = " MEM $icon $mem_used_percents "

# ─── Battery ─────────────────────────────────────────────────────────
# full_format / not_charging_format must be overridden so the % stays
# visible when the battery reports "Full" (otherwise it shows icon only).
#
# $power              : current power draw in W (unit already appended by
#                       the block, do NOT add a literal "W" — it doubles).
# $time_remaining     : time until full (charging) or empty (discharging)
#                       Duration placeholder, .dur() formats it as a string.
#                       Hidden by the conditional group when the battery is
#                       not actively (dis)charging.
[[block]]
block = "battery"
device = "BAT0"
interval = 10
full_threshold = 100
format              = " $icon $percentage {$power |}{$time_remaining.dur(hms:true, min_unit:m) |} "
full_format         = " $icon $percentage {$power |}{$time_remaining.dur(hms:true, min_unit:m) |} "
not_charging_format = " $icon $percentage {$power |}{$time_remaining.dur(hms:true, min_unit:m) |} "
charging_format     = " $icon $percentage {$power |}{$time_remaining.dur(hms:true, min_unit:m) |} "
empty_format        = " $icon $percentage {$power |}{$time_remaining.dur(hms:true, min_unit:m) |} "

# ─── Network ─────────────────────────────────────────────────────────
[[block]]
block = "net"
interval = 2
format = " $icon {$signal_strength $ssid|}"
inactive_format = " $icon Down "
missing_format = " $icon × "

# ─── Sound ───────────────────────────────────────────────────────────
# Right-click toggles mute (built-in default for the sound block).
[[block]]
block = "sound"
driver = "auto"
format = " $icon {$volume |}"

# ─── Time ────────────────────────────────────────────────────────────
# Toggle between short and full format via [block.format] table.
[[block]]
block = "time"
interval = 30

[block.format]
short = " $icon $timestamp.datetime(f:'%a %d %b  %R') "
full  = " $icon $timestamp.datetime(f:'%A %d %B %Y  %R') "